# Codemagic 云编译配置 —— 用于 GitHub Actions 不可用时出 iOS IPA / Android APK
#
# 用法（3 步，全程网页操作，不需要 Mac）：
#   1. 打开 https://codemagic.io 用 GitHub 账号登录（免费额度够用）
#   2. Add application → 选 GitHub → 选 xiaomcm/zhujitown-app → 类型选 iOS App
#   3. 打开这个 workflow 点 Start new build，跑完在 Artifacts 下载 IPA
#
# 注意：Codemagic 直接从 GitHub 拉代码，不依赖 GitHub Actions，
# 所以即使 GitHub 账号的 Actions 被禁用也能正常构建。
#
# 若提示 instance_type 不可用（免费计划限制），把 mac_mini_m2 改成 mac_mini_m1。

workflows:
  ios-unsigned-ipa:
    name: 构建 iOS IPA（免证书）
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: ZhuJiTown
    scripts:
      - name: 查看 Xcode 版本
        script: |
          xcodebuild -version
      - name: 构建未签名 IPA
        script: |
          cd zhujitown-ios
          bash scripts/build_unsigned_ipa.sh
      - name: 打包 WordPress 插件（随 IPA 一起下载）
        script: |
          cd zhujitown-auth && zip -qr ../outputs/zhujitown-auth.zip zhujitown-auth.php README.md || true
    artifacts:
      - zhujitown-ios/outputs/**/*.ipa
      - outputs/**/*.zip

  android-apk:
    name: 构建 Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: 写入站点地址
        script: |
          cd zhujitown-android
          echo "SITE_URL=https://www.zhujitown.com" > local.properties
      - name: 构建 Release APK
        script: |
          cd zhujitown-android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
      - name: 改名便于识别
        script: |
          cd zhujitown-android
          mkdir -p outputs
          cp app/build/outputs/apk/release/app-release.apk outputs/主机镇-v1.2.0-账号版.apk
    artifacts:
      - zhujitown-android/outputs/**/*.apk
